
name: Build Annie AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Checking for Android Gradle project"
          find . -maxdepth 3 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
